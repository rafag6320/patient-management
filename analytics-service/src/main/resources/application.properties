spring.application.name=analytics-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

server.port=4002

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.auto-offset-reset=earliest

logging.pattern.level=%5p [correlation:%X{correlationId:-none}]
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

management.endpoints.web.exposure.include=health,metrics,analyticswork

spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
