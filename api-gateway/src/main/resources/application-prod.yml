server:
  port: 4004

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: http://host.docker.internal:4000
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation 
            - id: auth-service
              uri: http://host.docker.internal:4005
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
