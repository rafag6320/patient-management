server:
  port: 4004

springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    disable-swagger-default-url: true
    persist-authorization: false
    validator-url: ""
    operations-sorter: alpha
    tags-sorter: alpha
    urls-primary-name: API publica (gateway)
    urls:
      - name: API publica (gateway)
        url: /openapi/gateway.json
      - name: Patient interno
        url: /openapi/patient.json
      - name: Auth interno
        url: /openapi/auth.json
      - name: Analytics interno
        url: /openapi/analytics.json
      - name: Operacion interna (Actuator)
        url: /openapi/operations.json

auth:
  service:
    url: ${AUTH_SERVICE_ADDRESS}
    validation-timeout: ${AUTH_VALIDATION_TIMEOUT:2s}
    proxy-timeout: ${AUTH_PROXY_TIMEOUT:2s}

patient:
  service:
    url: ${PATIENT_SERVICE_ADDRESS}

analytics:
  service:
    url: ${ANALYTICS_SERVICE_ADDRESS}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: ${patient.service.url}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation
                - UpstreamAvailability
            - id: auth-service
              uri: ${auth.service.url}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                - AuthProxy
            - id: analytics-service
              uri: ${analytics.service.url}
              predicates:
                - Path=/api/analytics/summary
                - Method=GET
              filters:
                - StripPrefix=1
                - JwtValidation
                - UpstreamAvailability
