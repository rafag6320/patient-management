server:
  port: 4004

auth:
  service:
    url: ${AUTH_SERVICE_ADDRESS}
    validation-timeout: ${AUTH_VALIDATION_TIMEOUT:2s}
    proxy-timeout: ${AUTH_PROXY_TIMEOUT:2s}

patient:
  service:
    url: ${PATIENT_SERVICE_ADDRESS}

analytics:
  service:
    url: ${ANALYTICS_SERVICE_ADDRESS}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: ${patient.service.url}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation
                - UpstreamAvailability
            - id: auth-service
              uri: ${auth.service.url}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                - AuthProxy
            - id: analytics-service
              uri: ${analytics.service.url}
              predicates:
                - Path=/api/analytics/summary
                - Method=GET
              filters:
                - StripPrefix=1
                - JwtValidation
                - UpstreamAvailability
