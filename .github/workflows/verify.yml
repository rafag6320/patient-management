name: Verify backend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable Maven wrapper
        run: chmod +x patient-service/mvnw
      - name: Compile and test isolated contexts
        run: ./scripts/verify.ps1 -WithContexts
      - name: PostgreSQL migration and recovery checks
        run: |
          ./scripts/verify-migrations-postgres.ps1
          ./scripts/verify-billing-postgres.ps1
          ./scripts/verify-recovery-postgres.ps1
      - name: Test and synthesize infrastructure
        run: ./scripts/synth.ps1
      - name: Test bounded LocalStack scope
        run: ./scripts/verify-localstack.ps1
      - name: Build all images and run full-system acceptance
        run: ./scripts/verify-system.ps1
      - name: Preserve reports even when a check fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          include-hidden-files: true
          path: |
            .verification/**/surefire-reports/**
            .verification/**/failsafe-reports/**
            .verification/infrastructure/cdk.out/**
            .verification/*.log
          retention-days: 14
