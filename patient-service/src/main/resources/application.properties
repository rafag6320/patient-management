spring.application.name=patient-service

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# SQL initialization
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Server
server.port=4000

# Logging
logging.level.root=INFO

# gRPC
billing.service.address=${BILLING_SERVICE_ADDRESS}
billing.service.port=${BILLING_SERVICE_PORT}
billing.service.deadline=${BILLING_DEADLINE:2s}

# kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# R07: bases existentes requieren adopcion explicita, nunca baseline automatico.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# R12/R13: bound remote work below the 45s lease; recover from unconfirmed sends.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1000
spring.kafka.producer.properties.delivery.timeout.ms=5000
registration.dispatcher.enabled=${REGISTRATION_DISPATCHER_ENABLED:true}
registration.dispatcher.delay-ms=${REGISTRATION_DISPATCHER_DELAY_MS:1000}
registration.uncertain-budget=${REGISTRATION_UNCERTAIN_BUDGET:5}

logging.pattern.level=%5p [correlation:%X{correlationId:-none}]
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

management.endpoints.web.exposure.include=health,metrics,registrations

spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

# Readiness tracks own storage; remote Kafka outages are represented by durable pending work.
management.health.kafka.enabled=false
spring.kafka.admin.auto-create=false
