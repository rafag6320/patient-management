spring.application.name=auth-service
server.port=4005
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
jwt.secret=${JWT_SECRET}
# R07: bases existentes requieren adopcion explicita, nunca baseline automatico.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

logging.pattern.level=%5p [correlation:%X{correlationId:-none}]
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000

# The generated default security user is unused by the explicit login/JWT flow.
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR
