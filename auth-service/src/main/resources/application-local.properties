spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/auth_db}
jwt.secret=${JWT_SECRET:patient-management-local-development-secret-change-me}
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/dev/data.sql

spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
